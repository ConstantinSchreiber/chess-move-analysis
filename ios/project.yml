name: Tempo
options:
  bundleIdPrefix: com.constantinschreiber
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (or in Xcode → Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
packages:
  ChessCore:
    path: Packages/ChessCore
  StockfishKit:
    path: Packages/StockfishKit
targets:
  Tempo:
    type: application
    platform: iOS
    sources:
      - path: Tempo
        excludes:
          - "Resources/NNUE"
          - "Resources/NNUE/**"
      - path: Tempo/Resources/NNUE
        type: folder
        buildPhase: resources
    dependencies:
      - package: ChessCore
      - package: StockfishKit
    preBuildScripts:
      - name: Fetch Stockfish NNUE networks
        script: |
          "${SRCROOT}/scripts/fetch-nnue.sh" "${SRCROOT}/Tempo/Resources/NNUE"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.constantinschreiber.tempo
        PRODUCT_NAME: Tempo
        INFOPLIST_KEY_CFBundleDisplayName: Tempo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Tempo/Info.plist
      properties:
        CFBundleDisplayName: Tempo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Tempo uses the camera to photograph a chess board so it can read the position. Photos stay on your device.
        CFBundleURLTypes:
          - CFBundleURLName: com.constantinschreiber.tempo
            CFBundleURLSchemes: [tempo]
  TempoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TempoTests]
    dependencies:
      - target: Tempo
      - package: ChessCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.constantinschreiber.tempo.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tempo.app/Tempo"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Tempo:
    build:
      targets:
        Tempo: all
        TempoTests: [test]
    test:
      targets: [TempoTests]
    run:
      config: Debug
    archive:
      config: Release

